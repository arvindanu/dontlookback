</style></head><body>
<div id="st"><canvas id="c" width="960" height="540"></canvas>
<div id="ctl"><div class="b" id="bl" data-k="l">LOOK</div><div class="b" id="bd" data-k="d">DASH</div><div class="b" id="bs" data-k="s">SLIDE</div><div class="b" id="bj" data-k="j">JUMP</div></div>
<div class="ov" id="menu" style="display:flex"><h1>DON'T LOOK BACK</h1><p style="color:#a8869a;font-style:italic">It has been following you for a long time.</p><div id="sks"></div><p id="bst"></p><button class="btn" id="go">RUN</button><p class="sm">Jump rocks. Slide under beams. Dash through thorns. Hold LOOK to grab what glints behind you — but the longer you stare, the closer it gets.</p><div><button class="btn q" id="mu">SOUND ON</button></div></div>

<script>
const $=i=>document.getElementById(i),cv=$('c'),cx=cv.getContext('2d'),W=960,H=540,G=452,PX=330,R=Math.random,M=Math;

function tone(a,b,d,ty='sine',v=.2,dl=0){if(!AC)return;const t=AC.currentTime+dl,o=AC.createOscillator(),n=AC.createGain();o.type=ty;o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(M.max(b,20),t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(mst);o.start(t);o.stop(t+d+.05)}

/* ---------- state ---------- */
let g,mode='menu',look=0;
const mul=()=>M.min(1+(g.combo/8|0)*.5,3)*(g.multT>0?2:1);

function act(k,dn){if(k==='l'){look=dn;if(dn&&mode==='play')nz(.5,500,.12,.7);return}if(!dn||mode!=='play')return;

newRun();mode='play';look=0;$('menu').style.display=$('over').style.display='none';$('ctl').style.display='block';say("DON'T LOOK BACK")}
$('go').onclick=start;
function die(){if(mode!=='play')return;mode='dying';g.dieT=0;look=0;tone(90,25,1.6,'sawtooth',.4);nz(1,200,.4);g.flash=1;g.fc='#fff'}
function endRun(){mode='dead';const m=g.dist/50|0,sc=g.sc|0,old=SK.filter(s=>s[2]<=S.shards).length;S.shards+=g.shards;const nbst=sc>S.best;if(nbst)S.best=sc;save();const nw=SK.filter(s=>s[2]<=S.shards).slice(old).map(s=>s[0]);

o.style.display='flex';o.style.pointerEvents='none';setTimeout(()=>o.style.pointerEvents='auto',700);$('ctl').style.display='none';$('again').onclick=start;$('tm').onclick=()=>{mode='menu';newRun();menu();o.style.display='none';$('menu').style.display='flex'}}
/* ---------- world ---------- */

const t=T[R()*T.length|0],w={rock:54,beam:120,pit:160,wall:34}[t],o={t,x:g.nx,w,h:46+R()*34};g.obs.push(o);g.lw=t=='wall';

if(t=='rock'&&R()<.3){g.obs.push({t,x:o.x+w+80,w,h:46+R()*34});g.nx+=w+80}}
function hit(o){if(g.inv>0)return;g.inv=1.3;g.shake=16;g.flash=.7;g.fc='#c00';g.combo=0;
if(g.shield){g.shield=0;tone(600,200,.3,'square',.15);say('WARD SHATTERED')}else{g.gap-=130;g.stun=.5;tone(120,30,.4,'sawtooth',.3);nz(.3,300,.3)}

function grab(t){g.sc+=150*mul();[523,659,784,1047].forEach((f,i)=>tone(f,f,.4,'sine',.12,i*.07));

function upd(dt){if(!g)return;g.t+=dt;const m=g.dist/50,dark=cl(m/800),P=mode==='play';let v=mode==='menu'?180:0;

if(mode==='dying'){g.dieT+=dt;g.gap=M.max(-40,g.gap-420*dt);g.lookA+=(1-g.lookA)*M.min(1,dt*10);g.shake=M.max(g.shake,8);if(g.dieT>1.7)endRun()}

if(lk){g.gap-=(60+g.lookT*170+dark*60)*dt;if(g.lookT>1.5&&!g.lunged){g.lunged=1;g.gap-=90;g.shake=14;g.flash=.6;g.fc='#fff';nz(.4,120,.4);say('IT SAW YOU')}}
else{g.lunged=0;const b=M.max(220,470-m*.45);g.gap=g.gap<b?M.min(b,g.gap+45*dt):M.max(b,g.gap-20*dt)}

const h=g.slT>0&&!g.air?38:84;

g.sc+=v*dt/50*mul();

({wsp:()=>say(['it knows your name','keep running',"don't look",'it\'s so close',"you can't outrun it"][R()*5|0]),lie:()=>{nz(.5,2000,.3,2);tone(200,60,.6,'sawtooth',.25);g.shake=12},blk:()=>{say('THE LIGHT DIES');tone(300,40,1,'sine',.3)},fog:()=>say('THE FOG RISES'),srg:()=>{say("IT'S FASTER NOW");tone(60,40,1.2,'sawtooth',.3)}})[e[0]]()}

/* ---------- drawing ---------- */
